let state={screen:&#x27;feed&#x27;,league:&#x27;All&#x27;,selected:&#x27;jets&#x27;,market:&#x27;Spread&#x27;,admin:&#x27;Overview&#x27;,query:&#x27;&#x27;,paused:false,format:&#x27;american&#x27;,why:null,version:2};

  if(state.format===&#x27;decimal&#x27;)return decimal.toFixed(2);
  return decimal&gt;=2?&#x27;+&#x27;+number(100*(decimal-1)):&#x27;−&#x27;+number(100/(decimal-1));

    &lt;div class=&quot;p-why-grid&quot;&gt;&lt;div&gt;&lt;small&gt;${r.venue} offers&lt;/small&gt;&lt;strong&gt;${odds(r.decimal)}&lt;/strong&gt;&lt;span&gt;${money(100*(r.decimal-1))} profit on a $100 win&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;small&gt;Estimated fair odds&lt;/small&gt;&lt;strong&gt;${odds(1/r.probability)}&lt;/strong&gt;&lt;span&gt;${number(r.probability*100)}% chance · Pinnacle-based&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;small&gt;Expected profit per $100&lt;/small&gt;&lt;strong&gt;+${money(ev(r))}&lt;/strong&gt;&lt;span&gt;Before fees · Win/loss outcomes&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;details&gt;&lt;summary&gt;How the $100 example works&lt;/summary&gt;&lt;div class=&quot;p-example&quot;&gt;&lt;span&gt;${number(r.probability*100)}% × ${money(100*(r.decimal-1))} win profit&lt;/span&gt;&lt;strong&gt;+${money(r.probability*100*(r.decimal-1))}&lt;/strong&gt;&lt;span&gt;${number((1-r.probability)*100)}% × $100 loss&lt;/span&gt;&lt;strong&gt;−${money((1-r.probability)*100)}&lt;/strong&gt;&lt;span&gt;Average estimated profit&lt;/span&gt;&lt;strong&gt;+${money(ev(r))}&lt;/strong&gt;&lt;/div&gt;&lt;p&gt;Illustration across repeated equivalent positions. Fees and outcomes outside a decisive win or loss are excluded. Displayed figures are rounded.&lt;/p&gt;&lt;/details&gt;&lt;/div&gt;`;

  let body=&#x27;&#x27;,note=&#x27;&#x27;;
