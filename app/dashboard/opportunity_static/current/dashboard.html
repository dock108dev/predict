<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard</title>
  <link rel="stylesheet" href="/view/current/pregame.css">
  <link rel="stylesheet" href="/view/current/research.css">
  <link rel="stylesheet" href="/view/current/workbench-shell.css">
  <link rel="stylesheet" href="/view/current/dashboard.css">
  <script type="module" src="/view/current/workspace-nav.js"></script>
  <script type="module" src="/view/current/dashboard.js"></script>
</head>
<body class="research-page workbench-page">
  <a class="skip" href="#dashboard-main">Skip to Dashboard</a>
  <header class="masthead">
    <nav aria-label="Main" data-workspace-nav>
      <a href="/" aria-current="page">Dashboard</a><a href="/data">Data</a><a href="/experiments">Experiments</a>
    </nav>
  </header>
  <main class="board-wrap" id="dashboard-main">
    <header class="workspace-page-heading dashboard-heading">
      <div class="board-heading"><h1>Dashboard</h1></div>
      <button id="dashboard-reload" type="button">Reload saved prices</button>
    </header>
    <section aria-labelledby="dashboard-opportunities">
      <h2 id="dashboard-opportunities" class="sr-only">Current +EV opportunities</h2>
      <form id="dashboard-filters" class="dashboard-filters" aria-label="Opportunity filters">
        <div><label for="dashboard-sport">Sport</label><select id="dashboard-sport" name="sport"><option value="">All sports</option><option>NFL</option><option>NCAAF</option><option>NBA</option><option>NCAAB</option><option>MLB</option><option>NHL</option></select></div>
        <div><label for="dashboard-family">Bet type</label><select id="dashboard-family" name="family"><option value="">All bet types</option><option value="moneyline">Moneyline</option><option value="spread">Spread</option><option value="total">Total</option></select></div>
        <div><label for="dashboard-venue">Venue</label><select id="dashboard-venue" name="venue"><option value="">All venues</option><option value="kalshi">Kalshi</option><option value="polymarket_us">Polymarket US</option><option value="novig">Novig</option><option value="prophetx">ProphetX</option></select></div>
        <div><label for="dashboard-view">Show</label><select id="dashboard-view" name="view"><option value="">Positive EV</option><option value="all">All venue offers</option><option value="unavailable">EV unavailable</option></select></div>
        <div><label for="dashboard-rows-count">Rows per page</label><select id="dashboard-rows-count" name="rows"><option>25</option><option selected>50</option><option>100</option></select></div>
        <button id="dashboard-clear" type="button" hidden>Clear filters</button>
      </form>
      <p id="dashboard-status" role="status" aria-live="polite">Reading stored calculations…</p>
      <div id="dashboard-table" class="dashboard-table-wrap" hidden>
        <table class="catalog-table dashboard-table" role="table" aria-labelledby="dashboard-opportunities">
          <thead role="rowgroup"><tr role="row"><th scope="col" role="columnheader">Game</th><th scope="col" role="columnheader">Bet</th><th scope="col" role="columnheader">Best venue</th><th scope="col" role="columnheader">Posted odds</th><th scope="col" role="columnheader">Fair odds</th><th scope="col" role="columnheader" aria-sort="descending">EV</th><th scope="col" role="columnheader">Quote age</th></tr></thead>
          <tbody id="dashboard-rows" role="rowgroup"></tbody>
        </table>
      </div>
      <nav id="dashboard-pages" class="dashboard-pages" aria-label="Opportunity pages" hidden>
        <button id="dashboard-previous" type="button">Previous</button>
        <span id="dashboard-page" aria-live="polite"></span>
        <button id="dashboard-next" type="button">Next</button>
      </nav>
      <details class="dashboard-liquidity-coverage" id="dashboard-liquidity-coverage">
        <summary>Liquidity coverage</summary>
        <button id="dashboard-liquidity-refresh" type="button">Refresh coverage</button>
        <div id="dashboard-liquidity-content" role="status"></div>
      </details>
    </section>
    <details class="dashboard-diagnostics" id="diagnostics">
      <summary>Diagnostics</summary>
      <ul>
        <li><a href="/data?evidence=mens-d1&amp;scope=mens-d1">Men’s D1 coverage and reconciliation</a></li>
        <li><a href="/settings#mens-d1-jobs">Men’s D1 collection jobs</a></li>
      </ul>
    </details>
  </main>
  <dialog id="dashboard-inspector" class="dashboard-inspector" aria-labelledby="dashboard-inspector-title">
    <div class="dashboard-inspector-head">
      <h2 id="dashboard-inspector-title">Opportunity evidence</h2>
      <form method="dialog"><button autofocus>Close</button></form>
    </div>
    <div id="dashboard-inspector-content"></div>
  </dialog>
</body>
</html>
