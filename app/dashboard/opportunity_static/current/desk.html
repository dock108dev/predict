<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prediction Arb</title>
  <script async src="/view/current/desk-bootstrap.js"></script>
  <link rel="icon" type="image/png" href="/view/current/predict-icon.png">
  <link rel="apple-touch-icon" href="/view/current/predict-icon.png">
  <link rel="stylesheet" href="/view/current/desk.css">
  <link rel="stylesheet" href="/view/current/desk-components.css">
  <link rel="modulepreload" href="/view/current/desk-drawer.js">
  <link rel="modulepreload" href="/view/current/desk-inspection.js">
  <script type="module" src="/view/current/desk.js"></script>
</head>
<body class="desk-app opportunities-app">
  <a class="skip-link" href="#main-content">Skip to results</a>
  <div data-shell></div>
  <main id="main-content">
    <nav id="desk-path" class="desk-path" aria-label="Current view" hidden></nav>
    <header class="desk-title page-heading">
      <div><p class="desk-kicker" id="desk-mode" hidden></p><h1 id="title">Opportunities</h1><p id="desk-subtitle" class="desk-meta" hidden></p></div>
      <a class="desk-action" id="browse-link" href="/browse-odds">Find my game ↗</a>
    </header>
    <div id="desk-readiness" hidden></div>
    <div class="replay-bar" id="replay-controls" hidden>
      <label>Saved capture <select id="replay-dataset"><option value="frozen">11 p.m. capture</option><option value="preview">Earlier capture</option></select></label>
      <nav aria-label="Replay views"><a id="replay-ev" href="/replay">Offers</a><a id="replay-arbs" href="/replay?view=arbs">Arbitrage</a></nav>
    </div>
    <nav id="phase-tabs" class="opportunity-tabs" aria-label="Game phase" hidden><a id="phase-pregame" href="/ev">Pregame</a><a id="phase-live" href="/ev?phase=live">Live</a></nav>
    <form id="filters" class="desk-filters">
      <div class="desk-toolbar">
        <nav id="opportunity-tabs" class="opportunity-tabs" aria-label="Opportunities"><a id="opportunity-ev" href="/ev">Expected value</a><a id="opportunity-arb" href="/arbs">Arbitrage</a></nav>
        <div id="market-tabs" class="opportunity-tabs" role="group" aria-label="Market family" hidden></div>
        <div class="desk-find">
          <label class="desk-search"><span class="sr-only">Search teams</span><input name="search" type="search" maxlength="150" placeholder="Search teams"></label>
          <button id="open-filters" type="button" aria-label="Filters" aria-haspopup="dialog">Filters<span id="filter-count" hidden></span></button>
        </div>
        <div class="desk-analysis">
          <label id="basis-field"><span class="sr-only">Calculation basis</span><select name="basis" disabled><option value="sportsbooks">Sportsbook estimate</option><option value="reviewed">Verified after-fee EV</option><option value="conservative">Conservative after-fee EV</option><option value="before">Before-fee scenario</option></select></label>
          <label id="group-field"><span class="sr-only">Rows</span><select name="group"><option value="outcome">By outcome</option><option value="offer">Individual offers</option></select></label>
          <label id="stake-field" hidden>Total stake before fees ($) <input name="stake" type="number" min="0.01" max="1000000" step="0.01" value="100"></label>
          <label id="positive-field" class="desk-toggle"><input name="positive" type="checkbox"> Positive only</label>
        </div>
        <div class="desk-list-tools">
          <label id="last-known-field" class="desk-toggle" hidden><input name="last_known" type="checkbox" value="1"> Last-known prices</label>
          <label id="alternates-field" class="desk-toggle" hidden><input id="alternates" type="checkbox"> Alternate lines</label>
          <label id="auto-update-field" class="desk-toggle" hidden><input id="auto-update" type="checkbox" checked> Auto-update</label>
          <button id="refresh-list" type="button">Refresh list</button>
        </div>
      </div>
      <div class="filter-chips" id="active-filters" aria-label="Active filters" hidden></div>
      <dialog id="filter-panel" aria-labelledby="filter-title">
        <div class="desk-title"><h2 id="filter-title">Filter results</h2><button id="close-filters" type="button" aria-label="Close filters">Close</button></div>
        <div class="filter-selections">
          <fieldset id="leagues"><legend>Leagues</legend></fieldset>
          <fieldset id="families"><legend>Markets</legend></fieldset>
          <fieldset id="venues"><legend>Sites</legend></fieldset>
        </div>
        <details class="filter-section" id="timing-filters">
          <summary>Schedule and game state</summary>
          <div class="desk-thresholds">
            <label>Date <input name="day" type="date"></label>
            <label>Time zone <select name="timezone"><option value="">Default time zone</option><option value="America/New_York">Eastern</option><option value="UTC">UTC</option></select></label>
            <label>Starts from <input name="time_from" type="time"></label><label>Starts before <input name="time_to" type="time"></label>
            <label id="game-state-field">Game state <select name="game_state"><option value="">All observed states</option><option value="scheduled">Scheduled</option><option value="live">Live observed</option><option value="suspended">Suspended</option><option value="final">Final</option><option value="unknown">Unknown</option></select></label>
            <label id="period-field">Period <select name="period"><option value="">All periods</option><option value="full_game">Full game</option></select></label>
          </div>
          <p id="time-window-error" class="inspection-gap" role="status" hidden></p>
        </details>
        <details class="filter-section" id="return-filters">
          <summary id="return-title">Return thresholds</summary>
          <div class="desk-thresholds">
            <label id="sort-field" hidden>Sort <select name="sort"><option value="return">Highest return</option><option value="start">Soonest start</option></select></label>
            <label>Minimum return (%) <input name="minimum" type="number" step="any"></label>
            <label id="profit-field" hidden>Minimum profit ($) <input name="profit" type="number" step="any"></label>
          </div>
        </details>
        <div class="filter-footer"><button type="button" id="reset">Clear all</button><button type="button" id="filter-done" class="desk-primary">Done</button></div>
      </dialog>
    </form>
    <div class="desk-feedback">
      <p id="notice" class="desk-note" role="status"></p>
      <p id="refresh-status" class="sr-only" role="status"></p>
      <p id="updates-ready" class="desk-note" role="status" hidden>New order available</p>
    </div>
    <p id="previous-results" class="desk-note previous-results" role="status" hidden></p>
    <div id="results" aria-label="Sorted results"></div>
    <nav class="desk-pages" aria-label="Results pages" hidden>
      <button id="previous" type="button" disabled>Previous</button>
      <span class="desk-meta" id="page-range"></span>
      <button id="next" type="button" disabled>Next</button>
    </nav>
    <footer class="desk-session"><a class="desk-action" id="replay-link" href="/replay">Saved odds</a> <button id="open-session" type="button" aria-haspopup="dialog">Session history</button></footer>
  </main>
  <dialog id="trade" aria-labelledby="trade-title">
    <div class="desk-title"><h2 id="trade-title">Trade details</h2><form method="dialog"><button>Close</button></form></div>
    <div id="preview-controls" hidden>
      <label for="preview-amount">Maximum upfront cost <span class="preview-input">$ <input id="preview-amount" type="number" min="0.01" max="1000000" step="0.01" value="10"></span></label>
    </div>
    <div id="trade-body"></div>
    <footer class="inspection-footer">
      <button id="back-to-pair" type="button" hidden>Back to pairing</button><button id="latest" type="button">Use latest prices</button>
      <button id="refresh-preview" type="button" hidden>Refresh</button>
      <p id="trade-note" role="status"></p>
    </footer>
  </dialog>
  <dialog id="session-history" aria-labelledby="session-title">
    <div class="desk-title"><h2 id="session-title">Diagnostic session history</h2><form method="dialog"><button>Close</button></form></div>
    <p id="session-summary"></p>
    <div class="desk-empty-actions"><button id="session-export" type="button">Export session JSON</button><button id="session-clear" type="button">Start new session</button></div>
    <ol id="session-events"></ol>
  </dialog>
</body>
</html>
