<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Predict · Raw Odds</title>
<link rel="stylesheet" href="/view/current/desk.css">
<script type="module" src="/current/assets/raw-odds.js"></script>
<link rel="stylesheet" href="/current/assets/raw-odds.css">
</head>
<body class="raw-odds"><a class="skip-link" href="#content">Skip to received prices</a>
<header class="p-chrome raw-header">
<a class="p-brand" href="/">Predict</a>
<nav aria-label="Views"><a href="/">Dashboard</a><a href="/odds">Odds</a><a href="/raw-odds" aria-current="page">Raw Odds</a><a href="/ev" title="Expected value">EV</a><a href="/current/coverage">Coverage</a><a href="/admin">Admin</a></nav>
<button id="stop" type="button">Stop collection</button>
</header>
<main>
<div class="desk-title"><h1>Raw Odds</h1><a class="desk-action" href="/api/raw/export" download>Export original inputs</a></div>
<section class="raw-filters" aria-label="Received price filters">
<label class="raw-search">Search<input id="search" type="search" placeholder="Team or game" autocomplete="off"></label>
<label>League<select id="league"><option value="">All leagues</option></select></label>
<label>Venue<select id="venue"><option value="">All sources</option></select></label>
<label>Market<select id="family"><option value="">All markets</option></select></label>
<details class="raw-extra-filters"><summary id="extra-filters-label">More filters</summary><div>
<label>Period<select id="period"><option value="">All periods</option></select></label>
<label>Status<select id="state"><option value="">All states</option><option value="synchronized">Synchronized</option><option value="delayed">Delayed</option><option value="last_known">Last-known</option><option value="unqualified">Unqualified</option><option value="aggregate">Scheduled refresh</option></select></label>
<label>Game ID<input id="game" type="search" placeholder="Any source event" autocomplete="off"></label>
</div></details>
<button id="clear-filters" type="button" disabled>Clear filters</button>
</section>
<div class="raw-status"><p id="status" role="status">Loading received prices…</p><button id="retry" hidden>Retry prices</button><details id="read-diagnostics" hidden><summary>Technical details</summary><p id="read-error"></p></details>
<details id="unusable"><summary>Unqualified source frames</summary><div id="unusable-content"></div></details></div>
<div class="raw-pagination"><button id="previous" disabled>Previous page</button><span id="page-number" role="status" aria-atomic="true"></span><button id="next" disabled>Next page</button><button id="refresh">Refresh prices</button><label><input id="live" type="checkbox" checked> Live updates</label></div>
<section id="content" aria-label="Received prices" aria-busy="true" tabindex="-1"></section>
<dialog id="details" aria-labelledby="details-title"><div class="dialog-head"><h2 id="details-title">Details</h2><button id="close-details">Close</button></div><div id="detail-content"></div></dialog>
<footer><span>Read-only comparisons · No trades placed</span><div><a href="/admin">Source status</a><a href="/scanner">Advanced Scanner</a></div></footer>
</main></body></html>
