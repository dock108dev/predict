name: Scheduled assurance
on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
    inputs:
      scope:
        description: Bounded assurance checks
        type: choice
        options: [all, compatibility, postgres]
        default: all
env:
  CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compatibility:
    if: ${{ github.event_name == 'schedule' || inputs.scope == 'all' || inputs.scope == 'compatibility' }}
    name: macOS Python ${{ matrix.python }}
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: ${{ matrix.python }}
      - run: sh scripts/check-ci
      - name: Build and install compatibility package
        id: package
        if: ${{ !cancelled() }}
        run: python scripts/ci/package_smoke.py
      - name: Compatibility package summary
        if: always()
        env:
          CHECK_OUTCOMES: ${{ toJSON(steps) }}
        run: python scripts/ci/quality_report.py --package
      - name: Retain compatibility reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assurance-macos-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14
  postgres:
    if: ${{ github.event_name == 'schedule' || inputs.scope == 'all' || inputs.scope == 'postgres' }}
    name: Historical PostgreSQL storage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: '3.14'
      - name: Use runner PostgreSQL 16 binaries
        run: echo '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"
      - name: Disposable migrations and transaction tests
        id: postgres
        run: python scripts/ci/postgres.py
      - name: Storage summary
        if: always()
        env:
          CHECK_OUTCOMES: ${{ toJSON(steps) }}
        run: python scripts/ci/quality_report.py --postgres
      - name: Retain storage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assurance-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14
  health:
    name: CI health sample
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Read bounded history
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/health.py
      - name: Retain health sample
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assurance-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/health/
          if-no-files-found: error
          retention-days: 14
