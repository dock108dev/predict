name: Optional diagnostics
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Bounded assurance checks
        type: choice
        options: [all, postgres, security]
        default: all
env:
  CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.scope || 'security' }}
  cancel-in-progress: false
jobs:
  postgres:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.scope == 'all' || inputs.scope == 'postgres') }}
    name: PostgreSQL storage
    uses: ./.github/workflows/storage.yml
    with:
      python: '3.14'
  security:
    if: ${{ inputs.scope == 'all' || inputs.scope == 'security' }}
    name: Dependency refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
        with:
          python: '3.14'
      - name: Audit current advisory data against locked dependencies
        id: audit
        run: |
          mkdir -p test-results/quality
          python -m pip_audit -r requirements-ci.txt -r requirements-browser.txt --require-hashes --disable-pip --progress-spinner off --timeout 20 -f json -o test-results/quality/audit.json
      - name: Audit alternate runtime lock
        id: uv_audit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          python scripts/ci/uv_audit_requirements.py
          python -m pip_audit -r test-results/quality/uv-requirements.txt --require-hashes --disable-pip --progress-spinner off --timeout 20 -f json -o test-results/quality/uv-audit.json
      - name: Dependency refresh summary
        if: always()
        env:
          CHECK_OUTCOMES: ${{ toJSON(steps) }}
        run: python scripts/ci/quality_report.py --audit
      - name: Retain dependency findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assurance-dependencies-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/quality/
          if-no-files-found: error
          retention-days: 14
  health:
    name: CI health sample
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Read bounded history
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/health.py
      - name: Retain health sample
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assurance-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/health/
          if-no-files-found: error
          retention-days: 14

  summary:
    name: Assurance result
    needs: [postgres, security, health]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report requested checks and intentional scope skips
        env:
          ASSURANCE_SCOPE: ${{ inputs.scope || 'security' }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/assurance_report.py
      - name: Retain assurance result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assurance-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/assurance/
          if-no-files-found: error
          retention-days: 14
