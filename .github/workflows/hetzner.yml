name: Deploy Predict dev server

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: predict-hetzner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  release-image:
    name: Build and verify Hetzner image
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Linux image and smoke test Compose
        run: |
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" -t predict:test .
          PREDICT_IMAGE=predict:test bash deploy/smoke.sh
      - name: Publish the tested image by digest
        id: publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="$repo:$GITHUB_SHA"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag predict:test "$tag"
          docker push "$tag"
          image=$(docker image inspect "$tag" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -F "$repo@")
          [[ $image =~ ^ghcr\.io/dock108dev/predict@sha256:[a-f0-9]{64}$ ]]
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
  deploy-hetzner:
    name: Deploy Predict to Hetzner
    needs: release-image
    if: ${{ vars.HETZNER_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: hetzner
    concurrency:
      group: predict-hetzner-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      pull-requests: read
    steps:
      - name: Deploy the smoke-tested image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.HETZNER_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.HETZNER_HOST }}
          PREDICT_IMAGE: ${{ needs.release-image.outputs.image }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -n $PR_NUMBER ]]; then
            tip=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq 'select(.state == "open") | .head.sha')
            expected=$PR_HEAD
          else
            tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            expected=$GITHUB_SHA
          fi
          if [[ "$tip" != "$expected" ]]; then
            echo 'This run no longer matches the selected branch or open PR.'
            exit 0
          fi
          [[ $SSH_HOST =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]+$ && -n $SSH_KEY && -n $SSH_KNOWN_HOSTS ]]
          [[ $PREDICT_IMAGE =~ ^ghcr\.io/dock108dev/predict@sha256:[a-f0-9]{64}$ ]]
          umask 077
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$keydir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$keydir/known_hosts"
          printf '%s\n' "$PREDICT_IMAGE" "$GITHUB_ACTOR" "$GH_TOKEN" | ssh -i "$keydir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$keydir/known_hosts" -o ConnectTimeout=15 "predict-deploy@$SSH_HOST"
