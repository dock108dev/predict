name: Deploy Predict dev server

on:
  workflow_dispatch:
    inputs:
      publish_only:
        description: Build, smoke-test, and publish the selected branch without deploying
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: predict-hetzner-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.sha }}
  CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  release-image:
    name: Build and verify Hetzner images
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      images: ${{ steps.publish.outputs.images }}
      proxy: ${{ steps.proxy.outcome }}
      smoke: ${{ steps.smoke.outcome }}
      publish: ${{ steps.publish.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify public proxy routes and Admin authentication
        id: proxy
        run: |
          sudo apt-get update
          package=$(mktemp -d)
          trap 'rm -rf "$package"' EXIT
          (cd "$package" && apt-get download caddy && dpkg-deb -x ./*.deb .)
          CADDY_BIN="$package/usr/bin/caddy" bash deploy/smoke-proxy.sh
      - name: Build service images and smoke test Compose
        id: smoke
        run: |
          [[ $(git rev-parse HEAD) == "$RELEASE_SHA" ]]
          python3 deploy/image-inputs.py > "$RUNNER_TEMP/predict-image-inputs"
          while read -r role inputs; do
            docker build --target "$role" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$RELEASE_SHA" \
              --label "dev.dock108.predict.role=$role" \
              --label "dev.dock108.predict.inputs=$inputs" -t "predict:$role-test" .
          done < "$RUNNER_TEMP/predict-image-inputs"
          PREDICT_WEB_IMAGE=predict:web-test PREDICT_COLLECTOR_IMAGE=predict:collector-test \
            PREDICT_ARCHIVE_IMAGE=predict:archive-test bash deploy/smoke.sh
      - name: Publish the tested images by digest
        id: publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          manifest="$RUNNER_TEMP/predict-image-manifest"
          while read -r role inputs; do
            tag="$repo:$role-$RELEASE_SHA"
            docker tag "predict:$role-test" "$tag"
            docker push "$tag" >&2
            image=$(docker image inspect "$tag" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -F "$repo@")
            [[ $image =~ ^ghcr\.io/dock108dev/predict@sha256:[a-f0-9]{64}$ ]]
            printf '%s %s\n' "$image" "$inputs"
          done < "$RUNNER_TEMP/predict-image-inputs" > "$manifest"
          printf 'images<<PREDICT_IMAGES\n%s\nPREDICT_IMAGES\n' "$(cat "$manifest")" >> "$GITHUB_OUTPUT"
  deploy-hetzner:
    name: Deploy Predict to Hetzner
    needs: release-image
    if: ${{ !inputs.publish_only && vars.HETZNER_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: hetzner
    concurrency:
      group: predict-hetzner-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    outputs:
      deploy: ${{ steps.deploy.outcome }}
    steps:
      - name: Deploy the smoke-tested images
        id: deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.HETZNER_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.HETZNER_HOST }}
          PREDICT_IMAGES: ${{ needs.release-image.outputs.images }}
        run: |
          branch=$(jq -nr --arg name "$GITHUB_REF_NAME" '$name | @uri')
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')
          if [[ $tip != "$RELEASE_SHA" ]]; then
            echo "The tip of $GITHUB_REF_NAME changed. Dispatch a new run to deploy it." >&2
            exit 1
          fi
          [[ $SSH_HOST =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]+$ && -n $SSH_KEY && -n $SSH_KNOWN_HOSTS ]]
          if [[ $(wc -l <<< "$PREDICT_IMAGES") -ne 3 ]]; then
            echo 'The release must contain web, collector, and archive images.' >&2
            exit 1
          fi
          while read -r image inputs extra; do
            if [[ ! $image =~ ^ghcr\.io/dock108dev/predict@sha256:[a-f0-9]{64}$ || ! $inputs =~ ^[a-f0-9]{64}$ || -n $extra ]]; then
              echo 'The release contains an invalid image digest or input fingerprint.' >&2
              exit 1
            fi
          done <<< "$PREDICT_IMAGES"
          umask 077
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$keydir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$keydir/known_hosts"
          printf '%s\n' predict-images-v1 "$GITHUB_ACTOR" "$GH_TOKEN" "$PREDICT_IMAGES" | ssh -i "$keydir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$keydir/known_hosts" -o ConnectTimeout=15 "predict-deploy@$SSH_HOST"
  report:
    name: Release result
    needs: [release-image, deploy-hetzner]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report smoke, publication and deploy outcomes
        env:
          RELEASE_OUTCOMES: ${{ toJSON(needs) }}
          RELEASE_PUBLISH_ONLY: ${{ inputs.publish_only }}
          RELEASE_DEPLOY_ENABLED: ${{ vars.HETZNER_DEPLOY_ENABLED == 'true' }}
        run: python3 scripts/ci/release_report.py
      - name: Retain release result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/release/
          if-no-files-found: error
          retention-days: 14
