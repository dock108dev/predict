name: Deploy Predict dev server

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_only:
        description: Build and publish the latest main release without deploying
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: predict-hetzner-${{ github.event.pull_request.number || github.event.workflow_run.id || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  release-image:
    name: Build and verify Hetzner image
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_sha != '') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_only) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: predict-hetzner-image-${{ github.event_name == 'pull_request' && github.run_id || 'main' }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      images: ${{ steps.publish.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || '' }}
          persist-credentials: false
      - name: Verify public proxy routes and Admin authentication
        run: |
          sudo apt-get update
          package=$(mktemp -d)
          trap 'rm -rf "$package"' EXIT
          (cd "$package" && apt-get download caddy && dpkg-deb -x ./*.deb .)
          CADDY_BIN="$package/usr/bin/caddy" bash deploy/smoke-proxy.sh
      - name: Build service images and smoke test Compose
        run: |
          [[ $(git rev-parse HEAD) == "$RELEASE_SHA" ]]
          python3 deploy/image-inputs.py > "$RUNNER_TEMP/predict-image-inputs"
          while read -r role inputs; do
            docker build --target "$role" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$RELEASE_SHA" \
              --label "dev.dock108.predict.role=$role" \
              --label "dev.dock108.predict.inputs=$inputs" -t "predict:$role-test" .
          done < "$RUNNER_TEMP/predict-image-inputs"
          PREDICT_WEB_IMAGE=predict:web-test PREDICT_COLLECTOR_IMAGE=predict:collector-test \
            PREDICT_ARCHIVE_IMAGE=predict:archive-test bash deploy/smoke.sh
      - name: Publish the tested images by digest
        id: publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          manifest="$RUNNER_TEMP/predict-image-manifest"
          while read -r role inputs; do
            tag="$repo:$role-$RELEASE_SHA"
            docker tag "predict:$role-test" "$tag"
            docker push "$tag"
            image=$(docker image inspect "$tag" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -F "$repo@")
            [[ $image =~ ^ghcr\.io/dock108dev/predict@sha256:[a-f0-9]{64}$ ]]
            printf '%s %s\n' "$image" "$inputs"
          done < "$RUNNER_TEMP/predict-image-inputs" > "$manifest"
          printf 'images<<PREDICT_IMAGES\n%s\nPREDICT_IMAGES\n' "$(cat "$manifest")" >> "$GITHUB_OUTPUT"
      - name: Publish the latest main release record
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ $tip != "$RELEASE_SHA" ]]; then
            echo 'Main advanced before publication.'
            exit 0
          fi
          # Publish all three tested digests in one registry operation.
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --tag "$repo:latest" \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            --label "dev.dock108.predict.images=$(cat "$RUNNER_TEMP/predict-image-manifest")" \
            - <<<'FROM scratch'
          docker push "$repo:latest"
  deploy-hetzner:
    name: Deploy Predict to Hetzner
    needs: release-image
    if: >-
      !cancelled() && vars.HETZNER_DEPLOY_ENABLED == 'true' &&
      ((github.event_name != 'workflow_dispatch' && needs.release-image.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.publish_only))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: hetzner
    concurrency:
      group: predict-hetzner-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      pull-requests: read
    steps:
      - name: Deploy the smoke-tested image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.HETZNER_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.HETZNER_HOST }}
          PREDICT_IMAGES: ${{ needs.release-image.outputs.images }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            latest="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
            if ! labels=$(docker buildx imagetools inspect "$latest" --format '{{json .Image.Config.Labels}}'); then
              echo 'Could not read the latest main release. Run the workflow with publish_only to create it.' >&2
              exit 1
            fi
            revision=$(jq -er '."org.opencontainers.image.revision" | select(test("^[a-f0-9]{40}$"))' <<< "$labels")
            PREDICT_IMAGES=$(jq -er '."dev.dock108.predict.images" | strings' <<< "$labels")
            echo "Deploying the latest published main release $revision."
          else
            if [[ -n $PR_NUMBER ]]; then
              tip=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq 'select(.state == "open") | .head.sha')
              expected=$PR_HEAD
            else
              tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
              expected=$RELEASE_SHA
            fi
            if [[ "$tip" != "$expected" ]]; then
              echo 'This run no longer matches the selected branch or open PR.'
              exit 0
            fi
          fi
          [[ $SSH_HOST =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]+$ && -n $SSH_KEY && -n $SSH_KNOWN_HOSTS ]]
          if [[ $(wc -l <<< "$PREDICT_IMAGES") -ne 3 ]]; then
            echo 'The release must contain web, collector, and archive images.' >&2
            exit 1
          fi
          while read -r image inputs extra; do
            if [[ ! $image =~ ^ghcr\.io/dock108dev/predict@sha256:[a-f0-9]{64}$ || ! $inputs =~ ^[a-f0-9]{64}$ || -n $extra ]]; then
              echo 'The release contains an invalid image digest or input fingerprint.' >&2
              exit 1
            fi
          done <<< "$PREDICT_IMAGES"
          umask 077
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$keydir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$keydir/known_hosts"
          printf '%s\n' predict-images-v1 "$GITHUB_ACTOR" "$GH_TOKEN" "$PREDICT_IMAGES" | ssh -i "$keydir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$keydir/known_hosts" -o ConnectTimeout=15 "predict-deploy@$SSH_HOST"
