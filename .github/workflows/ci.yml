name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline:
    name: Offline checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: '3.14'
      - name: Syntax and offline regressions
        run: sh scripts/check-ci
      - name: Report interrupted setup or execution
        if: always()
        env:
          CHECK_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          if [ ! -f test-results/ci/summary.md ]; then
            printf 'Offline report unavailable: setup failed or execution did not start. Tested SHA: %s; event: %s. Inspect step logs.\n' "$GITHUB_SHA" "$GITHUB_EVENT_NAME" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Retain offline diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-offline-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/ci/
          if-no-files-found: error
          retention-days: 14
  quality:
    name: Source, security and package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: '3.14'
      - name: Install checksum-pinned validators
        run: python scripts/ci/install_tools.py
      - name: Source and workflow quality
        id: source
        run: |
          mkdir -p test-results/quality
          python -m ruff check app tests scripts/ci
          python -m ruff format --check scripts/ci tests/test_ci_reporting.py
          .local/ci-tools/actionlint -shellcheck=''
          sh -n scripts/check-ci
          python -m pytest -q tests/test_ci_reporting.py --junitxml=test-results/quality/junit.xml
      - name: Secret scan of checkout inputs
        id: secrets
        if: ${{ !cancelled() }}
        run: |
          python scripts/ci/export.py .local/secret-scan
          .local/ci-tools/gitleaks dir .local/secret-scan --redact=100 --no-banner --config .gitleaks.toml --report-format json --report-path test-results/quality/secrets.json
      - name: Audit locked dependencies
        id: audit
        if: ${{ !cancelled() }}
        run: python -m pip_audit -r requirements-ci.txt --require-hashes --disable-pip --progress-spinner off --timeout 20 -f json -o test-results/quality/audit.json
      - name: Build and install package
        id: package
        if: ${{ !cancelled() }}
        run: python scripts/ci/package_smoke.py
      - name: Summarize outcomes
        if: always()
        env:
          CHECK_OUTCOMES: ${{ toJSON(steps) }}
        run: python scripts/ci/quality_report.py
      - name: Retain quality diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/quality/
            test-results/package/metrics.json
          if-no-files-found: error
          retention-days: 14
