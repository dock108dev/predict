name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_only:
        description: Check and publish current main without changing the server
        type: boolean
        default: false
      schema_maintenance:
        description: Deploy current main through the guarded backup and migration release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: predict-personal-${{ github.event_name == 'push' && 'main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  RELEASE_SHA: ${{ github.sha }}
  CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  personal:
    name: Personal beta checks and deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.schema_maintenance && 360 || 2 }}
    environment: hetzner
    permissions:
      contents: read
      packages: write
    steps:
      - name: Start measured personal lane
        run: echo "PREDICT_CICD_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/fast-checks
      - uses: ./.github/actions/personal-release
        with:
          publish-only: ${{ inputs.publish_only || false }}
          schema-maintenance: ${{ inputs.schema_maintenance || false }}
        env:
          RELEASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.HETZNER_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.HETZNER_HOST }}
          HETZNER_DEPLOY_ENABLED: ${{ vars.HETZNER_DEPLOY_ENABLED }}
      - name: Keep focused validation and release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: personal-beta-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/fast/
            test-results/release/
          if-no-files-found: warn
          retention-days: 7
