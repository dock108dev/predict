name: Fast personal checks
description: Personal data, calculation, checkpoint and deployment checks
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: '0.13.1'
        enable-cache: true
        cache-dependency-glob: |
          requirements-ci.txt
          pyproject.toml
    - name: Install locked Python tools and runtime
      shell: bash
      run: |
        uv pip install --system --python "$(command -v python)" --require-hashes -r requirements-ci.txt
        python scripts/ci/validate_lock.py
        uv pip install --system --python "$(command -v python)" --no-deps --no-build-isolation -e '.[stream]'
        uv pip check --system --python "$(command -v python)"
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      id: validators
      with:
        path: .local/ci-tools
        key: predict-validators-caddy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/install_tools.py') }}
    - name: Install checksum-pinned workflow and secret validators
      if: steps.validators.outputs.cache-hit != 'true'
      shell: bash
      run: python scripts/ci/install_tools.py
    - name: Run focused checks and record actual timing
      shell: bash
      env:
        PG_CONFIG: /usr/lib/postgresql/16/bin/pg_config
      run: python scripts/ci/fast_checks.py
