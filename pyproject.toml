[project]
name = "prediction-arb"
version = "0.1.0"
description = "Read-only prediction market adapters and shared models"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "psycopg[binary]>=3.2,<4", "aiohttp>=3.12,<4"]

[project.optional-dependencies]
stream = ["websockets>=15,<18", "cryptography>=50.0.0,<51", "keyring>=25,<26"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.fixtures" = ["*.json"]
"app.normalization" = ["*.json"]

"app.collection" = ["static/*"]

"app.storage" = ["migrations/*.sql"]
"app.dashboard" = ["static/*", "opportunity_static/*", "opportunity_static/u0/*", "opportunity_static/current/*", "e5_static/*", "e6_live_static/*", "e6_real_static/*", "e6_recovery_static/*", "*.json"]
